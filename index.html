<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بروتيرم للحلول الهندسية | الممثل المعتمد لـ Global Hi-Tech Films</title>
  <meta name="description" content="شركة بروتيرم للحلول الهندسية - الممثل والموزع المعتمد لشركة Global Hi-Tech Films العالمية المتخصصة في أفلام العزل الحراري، حماية الأسطح الفاخرة، وأفلام PPF للسيارات.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/images/protherme-logo.jpg">
  
  <!-- Google Fonts: Cairo, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            deep: '#020617',
            deepNavy: '#0a0f1d',
            slateCard: '#0f172a',
            cyanGlow: '#06b6d4',
            cyanLight: '#22d3ee',
            emeraldBrand: '#10b981',
            limeBrand: '#84cc16'
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            sans: ['Cairo', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- AOS (Animate on Scroll) -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
  
  <!-- Translations Dictionary (Fallback) -->
  <script src="assets/js/translations.js"></script>
  
  <!-- Alpine.js Application Controller -->
  <script defer src="assets/js/app.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>

<body x-data="prothermeApp" class="bg-[#020617] text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-black overflow-x-hidden relative">

  <!-- Ambient Floating Neon Gradient Blobs -->
  <div class="gradient-blob w-[500px] h-[500px] bg-cyan-600/20 top-[-100px] right-[-100px]"></div>
  <div class="gradient-blob w-[600px] h-[600px] bg-emerald-600/15 top-[600px] left-[-200px]" style="animation-delay: -3s;"></div>
  <div class="gradient-blob w-[500px] h-[500px] bg-blue-600/15 top-[1800px] right-[-100px]" style="animation-delay: -6s;"></div>
  <div class="gradient-blob w-[600px] h-[600px] bg-cyan-600/15 top-[3200px] left-[-150px]" style="animation-delay: -9s;"></div>

  <!-- Background Grid Pattern -->
  <div class="fixed inset-0 bg-grid-pattern opacity-40 pointer-events-none z-0"></div>

  <!-- ========================================== -->
  <!-- TOPBAR / CREDENTIAL STRIP                  -->
  <!-- ========================================== -->
  <div x-show="cms.visibility.topbar" class="relative z-50 bg-slate-950/90 border-b border-slate-800/80 text-xs py-2 px-4 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center gap-2 text-slate-300">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
          <i class="fa-solid fa-award me-1.5 text-cyan-400"></i>
          <span x-text="t('hero.badge')"></span>
        </span>
        <a href="https://globalhitechfilms.com" target="_blank" rel="noopener noreferrer" class="hidden sm:inline-flex items-center text-slate-400 hover:text-cyan-300 transition-colors">
          <i class="fa-solid fa-arrow-up-right-from-square text-[10px] me-1"></i>
          <span>globalhitechfilms.com</span>
        </a>
      </div>
      <div class="flex items-center gap-4 text-slate-300 ms-auto">
        <a :href="'tel:' + cms.contacts.phone" class="inline-flex items-center gap-1.5 hover:text-cyan-400 transition-colors font-medium">
          <i class="fa-solid fa-phone text-cyan-400"></i>
          <span dir="ltr" x-text="cms.contacts.phone"></span>
        </a>
        <span class="text-slate-700">|</span>
        <a :href="'mailto:' + cms.contacts.email" class="inline-flex items-center gap-1.5 hover:text-cyan-400 transition-colors">
          <i class="fa-solid fa-envelope text-cyan-400"></i>
          <span x-text="cms.contacts.email"></span>
        </a>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- STICKY NAVBAR                              -->
  <!-- ========================================== -->
  <header class="sticky top-0 z-40 bg-[#020617]/85 backdrop-blur-xl border-b border-slate-800/80 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- BRAND LOGO -->
        <a href="#" class="flex items-center gap-3.5 group py-2">
          <div class="relative p-1 bg-white/95 rounded-xl border border-cyan-500/40 shadow-[0_0_15px_rgba(6,182,212,0.3)] transition-transform duration-300 group-hover:scale-105">
            <img :src="cms.images.logo || 'assets/images/protherme-logo.jpg'" alt="ProTherme Engineering Solutions" class="h-11 w-auto object-contain rounded-lg">
          </div>
          <div class="flex flex-col">
            <span class="text-xl font-black tracking-tight text-white group-hover:text-cyan-400 transition-colors">ProTherme</span>
            <span class="text-[11px] text-cyan-400/90 font-medium" x-text="t('nav.brand_sub')"></span>
          </div>
        </a>

        <!-- DESKTOP NAVIGATION LINKS -->
        <nav class="hidden lg:flex items-center gap-1 xl:gap-2">
          <button @click="scrollTo('services')" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-cyan-400 hover:bg-slate-800/50 transition-all" x-text="t('nav.services')"></button>
          <button x-show="cms.visibility.technology" @click="scrollTo('technology')" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-cyan-400 hover:bg-slate-800/50 transition-all" x-text="t('nav.tech')"></button>
          <button x-show="cms.visibility.gallery" @click="scrollTo('gallery')" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-cyan-400 hover:bg-slate-800/50 transition-all" x-text="t('nav.gallery')"></button>
          <button @click="scrollTo('contact')" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-cyan-400 hover:bg-slate-800/50 transition-all" x-text="t('nav.contact')"></button>
        </nav>

        <!-- RIGHT ACTIONS: LANGUAGE SWITCHER & CTAS -->
        <div class="hidden sm:flex items-center gap-3">
          
          <!-- LANGUAGE SWITCHER BUTTON -->
          <div class="relative bg-slate-900/90 p-1 rounded-xl border border-slate-700/80 flex items-center shadow-inner">
            <button 
              @click="switchLang('ar')" 
              :class="lang === 'ar' ? 'bg-gradient-to-r from-cyan-600 to-cyan-500 text-white shadow-md' : 'text-slate-400 hover:text-white'"
              class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all duration-200">
              عربي
            </button>
            <button 
              @click="switchLang('en')" 
              :class="lang === 'en' ? 'bg-gradient-to-r from-cyan-600 to-cyan-500 text-white shadow-md' : 'text-slate-400 hover:text-white'"
              class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all duration-200">
              EN
            </button>
          </div>

          <!-- DIRECT CALL BUTTON -->
          <a :href="'tel:' + cms.contacts.phone" class="hidden xl:inline-flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 border border-slate-700 transition-all hover:border-cyan-500/50">
            <i class="fa-solid fa-phone text-cyan-400"></i>
            <span dir="ltr" x-text="cms.contacts.phone"></span>
          </a>

          <!-- GLOWING PRIMARY CTA -->
          <button 
            x-show="cms.buttons.navCta.visible"
            @click="scrollTo('contact')" 
            class="relative inline-flex items-center justify-center p-0.5 overflow-hidden text-xs font-bold rounded-xl group bg-gradient-to-br from-cyan-500 via-emerald-500 to-cyan-500 shadow-[0_0_20px_rgba(6,182,212,0.35)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] transition-all duration-300">
            <span class="relative px-4 py-2.5 transition-all ease-in duration-200 bg-slate-950 rounded-[10px] group-hover:bg-opacity-0 text-white">
              <i class="fa-solid fa-headset me-1.5 text-cyan-400 group-hover:text-white"></i>
              <span x-text="cms.buttons.navCta[lang] || t('nav.cta')"></span>
            </span>
          </button>
        </div>

        <!-- MOBILE MENU BUTTON & LANGUAGE -->
        <div class="flex items-center gap-2 lg:hidden">
          <button 
            @click="toggleLanguage()" 
            class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-800 border border-slate-700 text-cyan-400">
            <span x-text="lang === 'ar' ? 'English' : 'عربي'"></span>
          </button>
          <button 
            @click="mobileMenuOpen = !mobileMenuOpen" 
            class="p-2 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-300 hover:text-white focus:outline-none">
            <i class="fa-solid" :class="mobileMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
          </button>
        </div>

      </div>
    </div>

    <!-- MOBILE MENU DRAWER -->
    <div x-show="mobileMenuOpen" x-transition.opacity.duration.200ms class="lg:hidden bg-slate-950/95 border-b border-slate-800 px-4 pt-3 pb-6 space-y-2 backdrop-blur-2xl">
      <button @click="scrollTo('services')" class="w-full text-start px-3 py-2.5 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-900 hover:text-cyan-400" x-text="t('nav.services')"></button>
      <button x-show="cms.visibility.technology" @click="scrollTo('technology')" class="w-full text-start px-3 py-2.5 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-900 hover:text-cyan-400" x-text="t('nav.tech')"></button>
      <button x-show="cms.visibility.gallery" @click="scrollTo('gallery')" class="w-full text-start px-3 py-2.5 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-900 hover:text-cyan-400" x-text="t('nav.gallery')"></button>
      <button @click="scrollTo('contact')" class="w-full text-start px-3 py-2.5 rounded-lg text-sm font-medium text-slate-200 hover:bg-slate-900 hover:text-cyan-400" x-text="t('nav.contact')"></button>
      
      <div class="pt-3 border-t border-slate-800 space-y-2">
        <a :href="'tel:' + cms.contacts.phone" class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-100 font-bold text-sm">
          <i class="fa-solid fa-phone text-cyan-400"></i>
          <span dir="ltr" x-text="cms.contacts.phone"></span>
        </a>
        <button @click="scrollTo('contact')" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-950 font-black text-sm shadow-lg shadow-cyan-500/20" x-text="cms.buttons.navCta[lang] || t('nav.cta')"></button>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- HERO SECTION                               -->
  <!-- ========================================== -->
  <section class="relative pt-12 pb-20 md:pt-20 md:pb-32 overflow-hidden z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 items-center">
        
        <!-- HERO TEXT CONTENT -->
        <div class="lg:col-span-7 space-y-6 text-start">
          
          <!-- AUTHORIZED PARTNER FLOATING BADGE -->
          <div x-show="cms.visibility.heroBadge" data-aos="fade-down" data-aos-duration="600" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs sm:text-sm font-semibold shadow-[0_0_20px_rgba(6,182,212,0.15)] animate-float-slow">
            <span class="w-2 h-2 rounded-full bg-emerald-400 beacon-dot shadow-[0_0_8px_#10b981]"></span>
            <span x-text="t('hero.badge')"></span>
          </div>

          <!-- HEADLINE WITH VIBRANT GRADIENT -->
          <h1 data-aos="fade-up" data-aos-duration="700" class="text-3xl sm:text-5xl lg:text-6xl font-black tracking-tight text-white leading-[1.15]">
            <span class="block" x-text="t('hero.title_p1')"></span>
            <span class="block bg-gradient-to-r from-cyan-400 via-emerald-300 to-cyan-200 bg-clip-text text-transparent text-glow-cyan" x-text="t('hero.title_p2')"></span>
          </h1>

          <!-- SUBTITLE -->
          <p data-aos="fade-up" data-aos-duration="700" data-aos-delay="100" class="text-base sm:text-lg text-slate-300 leading-relaxed max-w-2xl font-normal" x-text="t('hero.subtitle')"></p>

          <!-- DUAL CTA BUTTONS -->
          <div data-aos="fade-up" data-aos-duration="700" data-aos-delay="150" class="flex flex-wrap items-center gap-4 pt-2">
            <a 
              x-show="cms.buttons.heroPrimary.visible"
              @click.prevent="scrollTo('contact')" 
              :href="cms.buttons.heroPrimary.target" 
              class="px-7 py-4 rounded-xl bg-gradient-to-r from-cyan-500 via-teal-500 to-emerald-500 text-slate-950 font-black text-sm sm:text-base shadow-[0_0_25px_rgba(6,182,212,0.4)] hover:shadow-[0_0_35px_rgba(6,182,212,0.7)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center gap-2 cursor-pointer glow-pulse-subtle">
              <i class="fa-solid fa-headset text-slate-900"></i>
              <span x-text="cms.buttons.heroPrimary[lang] || t('hero.cta_primary')"></span>
            </a>

            <a 
              x-show="cms.buttons.heroCall.visible"
              :href="'tel:' + cms.contacts.phone" 
              class="px-6 py-4 rounded-xl glass-panel text-slate-200 hover:text-white hover:border-cyan-500/60 font-bold text-sm sm:text-base hover:bg-slate-800/80 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center">
                <i class="fa-solid fa-phone"></i>
              </div>
              <span x-text="cms.buttons.heroCall[lang] || ('اتصال مباشر: ' + cms.contacts.phone)"></span>
            </a>
          </div>

          <!-- LIVE STATS GRID -->
          <div x-show="cms.visibility.heroStats" data-aos="fade-up" data-aos-duration="700" data-aos-delay="200" class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 pt-6 border-t border-slate-800/80">
            <div class="p-3.5 rounded-xl bg-slate-900/60 border border-slate-800 interactive-lift">
              <div class="text-2xl sm:text-3xl font-black font-mono text-cyan-400" x-text="cms.heroStats.stat1.num"></div>
              <div class="text-xs text-slate-400 font-medium mt-1" x-text="cms.heroStats.stat1['label_' + lang]"></div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-900/60 border border-slate-800 interactive-lift">
              <div class="text-2xl sm:text-3xl font-black font-mono text-emerald-400" x-text="cms.heroStats.stat2.num"></div>
              <div class="text-xs text-slate-400 font-medium mt-1" x-text="cms.heroStats.stat2['label_' + lang]"></div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-900/60 border border-slate-800 interactive-lift">
              <div class="text-2xl sm:text-3xl font-black font-mono text-cyan-300" x-text="cms.heroStats.stat3.num"></div>
              <div class="text-xs text-slate-400 font-medium mt-1" x-text="cms.heroStats.stat3['label_' + lang]"></div>
            </div>
            <div class="p-3.5 rounded-xl bg-slate-900/60 border border-slate-800 interactive-lift">
              <div class="text-2xl sm:text-3xl font-black font-mono text-emerald-300" x-text="cms.heroStats.stat4.num"></div>
              <div class="text-xs text-slate-400 font-medium mt-1" x-text="cms.heroStats.stat4['label_' + lang]"></div>
            </div>
          </div>

        </div>

        <!-- HERO VISUAL: CYBER GLASS CONTAINER -->
        <div class="lg:col-span-5 relative" data-aos="fade-up" data-aos-duration="800" data-aos-delay="200">
          
          <!-- Neon Glow Border Around Container -->
          <div class="relative rounded-3xl p-2 bg-gradient-to-b from-cyan-500/30 via-slate-800/60 to-emerald-500/20 shadow-[0_0_40px_rgba(6,182,212,0.2)]">
            
            <div class="relative rounded-2xl overflow-hidden bg-slate-950 aspect-[4/5] sm:aspect-[3/4] border border-cyan-500/30 group">
              <!-- Real Project Image Provided by User -->
              <img 
                :src="cms.images.heroVisual || 'assets/images/installation-site-real.jpg'" 
                alt="ProTherme Real Glass Facade Film Installation" 
                class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out filter brightness-[0.95] contrast-[1.05]">

              <!-- Subtle Gradient Overlay -->
              <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-black/30 pointer-events-none"></div>

              <!-- Top Badge -->
              <div class="absolute top-4 start-4 z-20 flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-950/85 backdrop-blur-md border border-cyan-500/40 text-xs font-bold text-white shadow-lg animate-float-slow">
                <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 beacon-dot"></span>
                <span x-text="cms.imageBadges?.heroTop?.[lang] || 'Global Hi-Tech Certified Crew'"></span>
              </div>

              <!-- Hotspot 1: High Rejection -->
              <div class="absolute top-[28%] end-[25%] z-20 group/spot cursor-pointer">
                <div class="hotspot-pin w-6 h-6 rounded-full bg-cyan-500 text-slate-950 flex items-center justify-center font-bold text-xs shadow-lg shadow-cyan-500/50">
                  <i class="fa-solid fa-temperature-arrow-down text-[10px]"></i>
                </div>
                <div class="absolute top-8 end-[-30px] w-40 p-2 rounded-xl bg-slate-950/90 backdrop-blur-md border border-cyan-500/40 text-[11px] text-white shadow-xl opacity-90 group-hover/spot:opacity-100 transition-opacity">
                  <span class="font-bold text-cyan-400 block" x-text="t('hero.hotspot1')"></span>
                  <span class="text-slate-300">Nano-Ceramic IR Shield</span>
                </div>
              </div>

              <!-- Hotspot 2: Precision Cut -->
              <div class="absolute bottom-[40%] start-[20%] z-20 group/spot cursor-pointer">
                <div class="hotspot-pin w-6 h-6 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-xs shadow-lg shadow-emerald-500/50">
                  <i class="fa-solid fa-check text-[10px]"></i>
                </div>
                <div class="absolute bottom-8 start-[-20px] w-44 p-2 rounded-xl bg-slate-950/90 backdrop-blur-md border border-emerald-500/40 text-[11px] text-white shadow-xl opacity-90 group-hover/spot:opacity-100 transition-opacity">
                  <span class="font-bold text-emerald-400 block" x-text="t('hero.hotspot3')"></span>
                  <span class="text-slate-300">Dust-Free Seamless Fit</span>
                </div>
              </div>

              <!-- Bottom Glass Card Over Image -->
              <div class="absolute bottom-4 inset-x-4 p-4 rounded-xl bg-slate-900/90 backdrop-blur-md border border-slate-700/80 shadow-2xl z-20">
                <div class="flex items-center justify-between">
                  <div>
                    <h4 class="text-sm font-bold text-white flex items-center gap-2">
                      <i class="fa-solid fa-building-columns text-cyan-400"></i>
                      <span x-text="t('hero.visual_badge')"></span>
                    </h4>
                    <p class="text-xs text-slate-400 mt-0.5" x-text="t('hero.visual_badge_sub')"></p>
                  </div>
                  <button @click="openLightbox(cms.images.heroVisual || 'assets/images/installation-site-real.jpg', 'gallery.item1_title', 'gallery.item1_desc')" class="p-2.5 rounded-lg bg-cyan-500/20 text-cyan-400 hover:bg-cyan-500 hover:text-slate-950 transition-colors">
                    <i class="fa-solid fa-expand text-xs"></i>
                  </button>
                </div>
              </div>

            </div>

          </div>

          <!-- Decorative Floating Corner Card -->
          <div class="hidden sm:flex absolute -bottom-6 -start-6 p-4 rounded-2xl bg-slate-900/95 border border-cyan-500/30 shadow-2xl backdrop-blur-xl z-30 items-center gap-3 animate-float-delayed">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center text-slate-950 text-xl font-bold">
              <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
              <div class="text-xs text-slate-400" x-text="cms.imageBadges?.heroCornerTag?.[lang] || 'Official Distributor'"></div>
              <div class="text-sm font-bold text-white" x-text="cms.imageBadges?.heroCornerName?.[lang] || 'Global Hi-Tech Films'"></div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- TRUST & CERTIFICATION BAR                  -->
  <!-- ========================================== -->
  <section x-show="cms.visibility.trustBar" class="py-10 bg-slate-950/70 border-y border-slate-800/80 relative z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
        
        <div data-aos="fade-up" data-aos-delay="50" class="interactive-lift flex items-center gap-3.5 p-3 rounded-2xl bg-slate-900/30 border border-transparent hover:border-cyan-500/30">
          <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-xl shrink-0">
            <i class="fa-solid fa-industry"></i>
          </div>
          <div>
            <div class="text-sm font-bold text-white" x-text="t('trust.t1')"></div>
            <div class="text-xs text-slate-400" x-text="t('trust.t1_sub')"></div>
          </div>

      <button @click="closeLightbox()" class="absolute top-4 end-4 z-10 w-10 h-10 rounded-full bg-slate-900/80 text-white hover:text-cyan-400 flex items-center justify-center border border-slate-700">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <div class="max-h-[75vh] overflow-hidden flex items-center justify-center bg-black">
        <img :src="lightboxImage" alt="Enlarged Project View" class="max-h-[75vh] w-auto object-contain">
      </div>
      <div class="p-6 bg-slate-900/90 border-t border-slate-800">
        <h4 class="text-lg font-bold text-white" x-text="lightboxTitle"></h4>
        <p class="text-xs sm:text-sm text-slate-300 mt-1" x-text="lightboxDesc"></p>
      </div>
    </div>
  </div>

  <!-- AOS Script Init -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>
</html>
