    t(keyPath) {
      // Check CMS texts override first
      if (this.cms && this.cms.texts && this.cms.texts[this.lang]) {
        const keys = keyPath.split('.');
        let currentCMS = this.cms.texts[this.lang];
        let foundCMS = true;
        for (const k of keys) {
          if (!currentCMS || currentCMS[k] === undefined) {
            foundCMS = false;
            break;
          }
          currentCMS = currentCMS[k];
        }
        if (foundCMS && typeof currentCMS === 'string') {
          return currentCMS;
        }
      }

      // Fallback to static dictionary
      const keys = keyPath.split('.');
      const dict = (typeof translations !== 'undefined' ? translations : (typeof window !== 'undefined' ? window.translations : {}));
      let current = dict[this.lang];
      for (const key of keys) {
        if (!current || current[key] === undefined) {
          let fallback = dict['en'];
          for (const fbKey of keys) {
            if (!fallback || fallback[fbKey] === undefined) return keyPath;
            fallback = fallback[fbKey];
          }
          return fallback;
        }
        current = current[key];
      }
      return current;
    },

    // Switch Language Dynamically
    switchLang(newLang) {
      if (this.lang === newLang) return;
      this.lang = newLang;
      localStorage.setItem('protherme_lang', newLang);
      this.updateDocumentAttributes();
      
      setTimeout(() => {
        if (typeof AOS !== 'undefined') {
          AOS.refresh();
        }
      }, 150);
    },

    toggleLanguage() {
      this.switchLang(this.lang === 'ar' ? 'en' : 'ar');
    },

    updateDocumentAttributes() {
      const dir = this.lang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.setAttribute('dir', dir);
      document.documentElement.setAttribute('lang', this.lang);
      document.title = this.t('meta.title');
    },

    // Computed Simulator Metrics
    get irrPercent() {
      if (this.vlt <= 15) return 88;
      if (this.vlt <= 35) return 85;
      if (this.vlt <= 50) return 82;
      return 79;
    },

    get uvPercent() {
      return '99.9%';
    },

    get tserPercent() {
      if (this.vlt <= 10) return 74;
      if (this.vlt <= 20) return 69;
      if (this.vlt <= 35) return 64;
      if (this.vlt <= 50) return 58;
      return 52;
    },

    get tempDrop() {
      if (this.vlt <= 20) return '14 - 16 °C';
      if (this.vlt <= 40) return '12 - 14 °C';
      return '10 - 12 °C';
    },

    get hvacSavings() {
      if (this.vlt <= 20) return '28% - 32%';
      if (this.vlt <= 40) return '24% - 28%';
      return '18% - 22%';
    },

    get vltHint() {
      if (this.vlt <= 20) return this.t('simulator.vlt_hint_dark');
      if (this.vlt <= 50) return this.t('simulator.vlt_hint_mid');
      return this.t('simulator.vlt_hint_clear');
    },

    // Open Lightbox
    openLightbox(imageSrc, titleKey, descKey) {
      this.lightboxImage = imageSrc;
      this.lightboxTitle = this.t(titleKey);
      this.lightboxDesc = this.t(descKey);
      this.lightboxOpen = true;
      document.body.style.overflow = 'hidden';
    },

    closeLightbox() {
      this.lightboxOpen = false;
      document.body.style.overflow = '';
    },

    showToast(message) {
      this.toastMessage = message;
      this.toastOpen = true;
      setTimeout(() => {
        this.toastOpen = false;
      }, 5000);
    },

    // Smooth Scroll Helper
    scrollTo(elementId) {
      this.mobileMenuOpen = false;
      const element = document.getElementById(elementId);
      if (element) {
        const navHeight = 90;
        const targetPosition = element.getBoundingClientRect().top + window.pageYOffset - navHeight;
        window.scrollTo({
          top: targetPosition,
          behavior: 'smooth'
        });
      }
    }
  };
}
window.prothermeApp = prothermeApp;
if (window.Alpine) { window.Alpine.data('prothermeApp', prothermeApp); }
document.addEventListener('alpine:init', () => { if (window.Alpine) { window.Alpine.data('prothermeApp', prothermeApp); } });
  </script>

              </a>
            </template>
            <template x-if="cms.social && cms.social.tiktok">
              <a :href="cms.social.tiktok" target="_blank" rel="noopener noreferrer" title="TikTok" class="w-9 h-9 rounded-xl bg-white hover:bg-slate-100 text-slate-600 hover:text-slate-900 border border-slate-200 hover:border-slate-400 flex items-center justify-center transition-all shadow-xs">
                <i class="fa-brands fa-tiktok text-sm"></i>
              </a>
            </template>
            <template x-if="cms.social && cms.social.youtube">
              <a :href="cms.social.youtube" target="_blank" rel="noopener noreferrer" title="YouTube" class="w-9 h-9 rounded-xl bg-white hover:bg-red-50 text-slate-600 hover:text-red-600 border border-slate-200 hover:border-red-400 flex items-center justify-center transition-all shadow-xs">
                <i class="fa-brands fa-youtube text-sm"></i>
              </a>
            </template>
          </div>
        </div>

        <!-- Core Services Links -->
        <div class="lg:col-span-3 space-y-3">
          <h4 class="text-sm font-bold text-slate-950 uppercase tracking-wider" x-text="t('footer.col_services')"></h4>
          <ul class="space-y-2 text-xs">
            <li><button @click="scrollTo('services')" class="hover:text-cyan-700 text-slate-600 transition-colors font-medium" x-text="t('footer.s1')"></button></li>
            <li><button @click="scrollTo('services')" class="hover:text-cyan-700 text-slate-600 transition-colors font-medium" x-text="t('footer.s2')"></button></li>
            <li><button @click="scrollTo('services')" class="hover:text-cyan-700 text-slate-600 transition-colors font-medium" x-text="t('footer.s3')"></button></li>
            <li><button @click="scrollTo('contact')" class="hover:text-cyan-700 text-slate-600 transition-colors font-medium" x-text="t('footer.s4')"></button></li>
          </ul>
        </div>

        <!-- Official Contact Details -->
        <div class="lg:col-span-4 space-y-3">
          <h4 class="text-sm font-bold text-slate-950 uppercase tracking-wider" x-text="t('footer.col_contact')"></h4>
          <ul class="space-y-2.5 text-xs">
            <li class="flex items-center gap-2.5">
              <i class="fa-solid fa-phone text-cyan-600"></i>
              <a :href="'tel:' + cms.contacts.phone" class="hover:text-cyan-700 text-slate-800 transition-colors font-mono font-bold" dir="ltr" x-text="cms.contacts.phone"></a>
            </li>
            <li class="flex items-center gap-2.5">
              <i class="fa-solid fa-envelope text-cyan-600"></i>
              <a :href="'mailto:' + cms.contacts.email" class="hover:text-cyan-700 text-slate-800 transition-colors font-medium" x-text="cms.contacts.email"></a>
            </li>
            <li class="flex items-center gap-2.5">
              <i class="fa-brands fa-whatsapp text-emerald-600"></i>
              <a :href="'https://wa.me/' + cms.contacts.whatsapp.replace(/[^0-9]/g, '')" target="_blank" class="hover:text-emerald-700 text-slate-800 transition-colors font-mono font-semibold" dir="ltr" x-text="cms.contacts.whatsapp"></a>
            </li>
            <li class="flex items-start gap-2.5 pt-1">
              <i class="fa-solid fa-clock text-cyan-600 mt-0.5"></i>
              <div>
                <span class="block text-slate-500" x-text="t('footer.hours_label')"></span>
                <span class="text-slate-800 font-semibold" x-text="cms.contacts.hours[lang] || t('footer.hours_val')"></span>
              </div>
            </li>
          </ul>

        </div>

      </div>

      <!-- Copyright & Back to Top -->
      <div class="pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
        <p x-text="t('footer.copyright')"></p>
        <button @click="window.scrollTo({ top: 0, behavior: 'smooth' })" class="flex items-center gap-2 hover:text-cyan-700 text-slate-600 transition-colors font-semibold">
          <span x-text="t('footer.back_to_top')"></span>
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>

    </div>
  </footer>

  <!-- ========================================== -->
  <!-- FLOATING QUICK SPEED DIAL (CALL & WHATSAPP)-->
  <!-- ========================================== -->
  <div x-show="cms.visibility.speedDial" class="fixed bottom-4 start-4 sm:bottom-6 sm:start-6 z-40 flex flex-col gap-2.5 sm:gap-3">
    <!-- WhatsApp Floating Action -->
    <a 
      :href="'https://wa.me/' + cms.contacts.whatsapp.replace(/[^0-9]/g, '')" 
      target="_blank" 
      rel="noopener noreferrer" 
      title="WhatsApp" 
      class="w-12 h-12 sm:w-13 sm:h-13 p-3 sm:p-3.5 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center text-lg sm:text-xl shadow-lg shadow-emerald-600/30 hover:scale-110 active:scale-95 transition-all glow-pulse-subtle ripple-wa">
      <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Direct Phone Call Floating Action -->
    <a 
      :href="'tel:' + cms.contacts.phone" 
      :title="'Call ' + cms.contacts.phone" 
      class="w-12 h-12 sm:w-13 sm:h-13 p-3 sm:p-3.5 rounded-full bg-cyan-600 hover:bg-cyan-500 text-white flex items-center justify-center text-lg sm:text-xl shadow-lg shadow-cyan-600/30 hover:scale-110 active:scale-95 transition-all glow-pulse-subtle ripple-call">
      <i class="fa-solid fa-phone"></i>
    </a>
  </div>

  <!-- ========================================== -->
  <!-- LIGHTBOX MODAL                             -->
  <!-- ========================================== -->
  <div 
    x-show="lightboxOpen" 
    x-transition.opacity.duration.300ms 
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4" 
    style="display: none;">
    <div @click.away="closeLightbox()" class="relative max-w-5xl w-full bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-2xl">
      <button @click="closeLightbox()" class="absolute top-4 end-4 z-10 w-10 h-10 rounded-full bg-white/90 text-slate-700 hover:text-slate-950 flex items-center justify-center border border-slate-300 shadow-md">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <div class="max-h-[75vh] overflow-hidden flex items-center justify-center bg-slate-950">
        <img :src="lightboxImage" alt="Enlarged Project View" class="max-h-[75vh] w-auto object-contain">
      </div>
      <div class="p-6 bg-white border-t border-slate-200">
        <h4 class="text-lg font-bold text-slate-950" x-text="lightboxTitle"></h4>
        <p class="text-xs sm:text-sm text-slate-600 mt-1" x-text="lightboxDesc"></p>
      </div>
    </div>
  </div>

  <!-- AOS Script Init -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>
</html>
